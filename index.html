<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Caneca 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    
    body {
      display: flex;
      height: 100vh;
      background-color: #121212;
      color: #ffffff;
      overflow: hidden;
    }

    #sidebar {
      width: 320px;
      background-color: #1a1a1a;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* Oculta o menu lateral em modo de visualização do cliente */
    body.client-mode #sidebar {
      display: none !important;
    }

    h1 {
      font-size: 1.1rem;
      color: #00adb5;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #2a2a2a;
      padding-bottom: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: #b0b0b0;
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #252525;
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #252525;
      cursor: pointer;
      padding: 2px;
    }

    .btn-share {
      background-color: #00adb5;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-share:hover {
      background-color: #008c93;
    }

    .btn-share:disabled {
      background-color: #555;
      cursor: wait;
    }

    .instructions {
      margin-top: auto;
      font-size: 0.8rem;
      color: #888;
      line-height: 1.5;
      background: #222;
      padding: 12px;
      border-radius: 6px;
    }

    #canvas-container {
      flex: 1;
      height: 100%;
      cursor: grab;
    }
    
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h1>Configurações do Mockup</h1>
    
    <div class="control-group">
      <label for="upload-art">ENVIAR ESTAMPA (PNG/JPG):</label>
      <input type="file" id="upload-art" accept="image/*">
    </div>

    <div class="control-group">
      <label for="mug-color">COR DO INTERIOR E ALÇA:</label>
      <input type="color" id="mug-color" value="#ffffff">
    </div>

    <button id="btn-share" class="btn-share">🔗 COPIAR LINK PARA CLIENTE</button>

    <div class="instructions">
      <p>💡 <strong>Modo Compartilhamento:</strong></p>
      <p>• Carregue a estampa e a cor desejada.</p>
      <p>• Clique em copiar para gerar o link em Alta Definição (HD).</p>
      <p>• O cliente abrirá apenas o 3D interativo sem as opções de edição.</p>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Verifica se a URL contém parâmetros para ativar o modo cliente
    const urlParams = new URLSearchParams(window.location.search);
    const isClientMode = urlParams.get('view') === '1';

    if (isClientMode) {
      document.body.classList.add('client-mode');
    }

    // 1. Cena, Câmera e Renderizador
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(3.2, 1.5, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 2.5;
    controls.maxDistance = 8;
    controls.target.set(0, 0, 0);

    // 2. Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.6);
    mainLight.position.set(5, 8, 5);
    scene.add(mainLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
    backLight.position.set(-5, 3, -5);
    scene.add(backLight);

    // 3. Canvas 2D Intermediário da Estampa em Alta Resolução (2K)
    const textureCanvas = document.createElement('canvas');
    textureCanvas.width = 2048;
    textureCanvas.height = 900;
    const ctx = textureCanvas.getContext('2d');

    const dynamicTexture = new THREE.CanvasTexture(textureCanvas);
    dynamicTexture.encoding = THREE.sRGBEncoding;
    dynamicTexture.minFilter = THREE.LinearFilter;
    dynamicTexture.magFilter = THREE.LinearFilter;
    
    // Melhora nitidez em ângulos inclinados se suportado pelo navegador
    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
    if (maxAnisotropy) dynamicTexture.anisotropy = maxAnisotropy;

    function updateTextureCanvas(img = null, bgColor = '#ffffff') {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);

      // Margem de 10% de cada lado (onde fica a alça)
      const marginX = textureCanvas.width * 0.10; 
      const printWidth = textureCanvas.width - (marginX * 2);
      const printHeight = textureCanvas.height;

      if (img) {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, marginX, 0, printWidth, printHeight);
      } else {
        ctx.fillStyle = '#00adb5';
        ctx.font = 'bold 80px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SUA ARTE AQUI', textureCanvas.width / 2, textureCanvas.height / 2 + 30);
        
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 15;
        ctx.strokeRect(marginX + 20, 20, printWidth - 40, printHeight - 40);
      }
      
      dynamicTexture.needsUpdate = true;
    }

    // 4. Materiais
    const printMaterial = new THREE.MeshStandardMaterial({
      map: dynamicTexture,
      roughness: 0.12,
      metalness: 0.05
    });

    const ceramicMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.12,
      metalness: 0.05
    });

    // 5. Construção do Modelo da Caneca
    const mugGroup = new THREE.Group();
    const radius = 1.15;
    const height = 2.6;

    // A. Corpo Externo
    const outerGeo = new THREE.CylinderGeometry(radius, radius, height, 64, 1, true);
    outerGeo.computeVertexNormals();

    const outerMesh = new THREE.Mesh(outerGeo, printMaterial);
    outerMesh.rotation.y = Math.PI / 2;
    mugGroup.add(outerMesh);

    // B. Interior da Caneca
    const innerGeo = new THREE.CylinderGeometry(radius - 0.08, radius - 0.08, height - 0.08, 64, 1, false);
    innerGeo.translate(0, 0.04, 0);
    const innerMesh = new THREE.Mesh(innerGeo, ceramicMaterial);
    mugGroup.add(innerMesh);

    // C. Borda Superior
    const rimGeo = new THREE.TorusGeometry(radius - 0.04, 0.04, 16, 64);
    rimGeo.rotateX(Math.PI / 2);
    rimGeo.translate(0, height / 2, 0);
    const rimMesh = new THREE.Mesh(rimGeo, ceramicMaterial);
    mugGroup.add(rimMesh);

    // D. Alça Curvada Completa
    const handleCurve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(radius - 0.05, height * 0.35, 0),
      new THREE.Vector3(radius + 0.95, height * 0.45, 0),
      new THREE.Vector3(radius + 0.95, -height * 0.45, 0),
      new THREE.Vector3(radius - 0.05, -height * 0.35, 0)
    );

    const handleGeo = new THREE.TubeGeometry(handleCurve, 32, 0.12, 16, false);
    const handleMesh = new THREE.Mesh(handleGeo, ceramicMaterial);
    handleMesh.rotation.y = 0;
    mugGroup.add(handleMesh);

    scene.add(mugGroup);

    // 6. Carregamento da Arte/Cor via URL (Leitura do link do cliente)
    let currentImage = null;

    const paramColor = urlParams.get('color');
    const paramArt = urlParams.get('art');

    if (paramColor) {
      ceramicMaterial.color.set('#' + paramColor);
      document.getElementById('mug-color').value = '#' + paramColor;
    }

    if (paramArt) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.src = decodeURIComponent(paramArt);
      img.onload = function() {
        currentImage = img;
        updateTextureCanvas(currentImage, paramColor ? '#' + paramColor : '#ffffff');
      };
    } else {
      updateTextureCanvas();
    }

    // 7. Controles e Eventos de Edição
    document.getElementById('upload-art').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            currentImage = img;
            const currentColor = document.getElementById('mug-color').value;
            updateTextureCanvas(currentImage, currentColor);
          };
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('mug-color').addEventListener('input', function(e) {
      const colorValue = e.target.value;
      ceramicMaterial.color.set(colorValue);
      updateTextureCanvas(currentImage, colorValue);
    });

    // 8. Botão para Copiar o Link em Alta Definição (PNG sem perdas para a Nuvem)
    const btnShare = document.getElementById('btn-share');

    btnShare.addEventListener('click', async function() {
      const colorClean = document.getElementById('mug-color').value.replace('#', '');
      let shareUrl = window.location.origin + window.location.pathname + `?view=1&color=${colorClean}`;

      if (currentImage) {
        btnShare.disabled = true;
        btnShare.innerText = '⏳ GERANDO LINK HD...';

        try {
          // Renderiza a imagem limpa na resolução total original em PNG de alta qualidade
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = 2048;
          tempCanvas.height = 900;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.imageSmoothingEnabled = true;
          tempCtx.imageSmoothingQuality = 'high';
          tempCtx.drawImage(currentImage, 0, 0, tempCanvas.width, tempCanvas.height);
          
          const base64Data = tempCanvas.toDataURL('image/png').split(',')[1];

          // Upload em HD para a nuvem
          const formData = new FormData();
          formData.append('image', base64Data);

          const response = await fetch('https://api.imgur.com/3/image', {
            method: 'POST',
            headers: { Authorization: 'Client-ID 546c25a59c58ad7' },
            body: formData
          });

          const data = await response.json();

          if (data.success) {
            shareUrl += `&art=${encodeURIComponent(data.data.link)}`;
          } else {
            throw new Error('Falha no upload');
          }
        } catch (err) {
          // Fallback comprimido caso fique sem conexão
          const artBase64 = textureCanvas.toDataURL('image/jpeg', 0.8);
          shareUrl += `&art=${encodeURIComponent(artBase64)}`;
        } finally {
          btnShare.disabled = false;
          btnShare.innerText = '🔗 COPIAR LINK PARA CLIENTE';
        }
      }

      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('Link curto em ALTA DEFINIÇÃO copiado com sucesso!');
      }).catch(() => {
        alert('Erro ao copiar automaticamente. Copie o endereço da barra do navegador.');
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
